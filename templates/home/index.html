<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechParts - Sua Loja de Peças de Computador</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230d6efd' width='100' height='100'/><text x='50' y='65' font-size='70' font-weight='bold' fill='white' text-anchor='middle'>⚙️</text></svg>" />
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Styles -->
    <style>
        .logo-icon {
            animation: spin 3s linear infinite;
            display: inline-block;
        }
        .logo-icon:hover {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- NAVBAR / CABEÇALHO -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary fs-3" href="{% url 'home' %}" title="TechParts - Sua Loja de Computador">
                <i class="bi bi-lightning-charge logo-icon"></i> TechParts
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'home' %}"><i class="bi bi-house-fill"></i> Início</a>
                    </li>
                    <!-- ABA DE PRODUTOS COM REDIRECIONAMENTO DJANGO -->
                    <li class="nav-item">
                        <a class="nav-link fw-bold text-warning" href="{% url 'produtos:produtos_home' %}">
                            <i class="bi bi-grid-fill"></i> Produtos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#diferenciais"><i class="bi bi-info-circle"></i> Sobre Nós</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contato"><i class="bi bi-telephone-fill"></i> Contato</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ÁREA DE CONTEÚDO (Onde o index.html será injetado) -->
    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- FOOTER / RODAPÉ -->
    <footer id="contato" class="bg-dark text-light py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-1 fw-bold text-primary"><i class="bi bi-lightning-charge logo-icon"></i> TechParts Store</p>
            <p class="small text-secondary mb-3">Sua loja de peças de computador de confiança.</p>
            <div class="mb-3">
                <a href="{% url 'produtos:produtos_home' %}" class="text-light me-3 text-decoration-none"><i class="bi bi-box"></i> Produtos</a>
                <a href="#diferenciais" class="text-light me-3 text-decoration-none"><i class="bi bi-heart"></i> Sobre</a>
                <a href="#" class="text-light text-decoration-none"><i class="bi bi-file-earmark-text"></i> Termos de Uso</a>
            </div>
            <p class="small text-muted mb-0">&copy; 2026 TechParts. Todos os direitos reservados. <i class="bi bi-code-square"></i></p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
